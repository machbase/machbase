title: Machbase

enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: true
googleAnalytics: G-5VYQQQFHCH
baseURL: https://docs.machbase.com/

DefaultContentLanguage: en
languages:
  en:
    languageName: English
    languageCode: en-US
    title: MACHBASE
    weight: 1
  kr:
    languageName: 한국어
    languageCode: ko-KR
    title: 마크베이스
    weight: 2
  ja:
    languageName: 日本語
    languageCode: ja-JP
    title: MACHBASE
    weight: 3
    params:
      landingPage: /neo
      navbar:
        logo:
          link: /neo
    menu:
      main:
        - identifier: home
          name: ホーム
          url: https://machbase.com/
          weight: 10
        - identifier: neo
          name: MACHBASE NEO
          pageRef: /neo
          weight: 20
        - identifier: dbms
          name: DBMS v8.7
          pageRef: /dbms
          weight: 30
        - identifier: dbms-v85
          name: DBMS v8.5
          pageRef: /dbms-8.5
          weight: 34
        - identifier: apps
          name: アプリ
          pageRef: /apps
          weight: 38
        - identifier: search
          name: 検索
          weight: 40
          params:
            type: search
        - identifier: github
          name: GitHub
          url: https://github.com/machbase/machbase
          weight: 50
          params:
            icon: github

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

enableInlineShortcodes: true

taxonomies:
  category: categories
  keyword: keywords
  tag: tags

ignoreFiles:
  - ".DS_Store"
  - "content/dbms-legacy/*"
  - "content/fluid/*"

params:
  dbmsVersion: 8.7.0
  latestNeoVer: v8.7.0
  examples_url: https://github.com/machbase/neo-server/tree/main/examples
  releases_url: https://github.com/machbase/neo-server/releases
  jdbc_version: 8.0.2

  displayUpdatedDate: true
  dateFormat: "Jan 2, 2006"

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/logo_machbase.png
      dark: images/machbase-logo-w.png
      link: /neo
      width: 200

  footer:
    displayCopyright: true
    displayPoweredBy: false
    width: normal

  page:
    contextMenu:
      enable: true

  search:
    enable: true

menu:
  main:
    - identifier: home
      name: Home
      url: "https://machbase.com/"
      weight: 10
    - identifier: neo
      name: MACHBASE NEO
      pageRef: /neo
      weight: 20
    - identifier: dbms
      name: DBMS v8.7
      pageRef: /dbms
      weight: 30
    - identifier: dbms-v85
      name: DBMS v8.5
      pageRef: /dbms-8.5
      weight: 34
    - identifier: apps
      name: Apps
      pageRef: /apps
      weight: 38
    - name: Search
      weight: 40
      params:
        type: search
    - name: Github
      url: "https://github.com/machbase/neo-server"
      params:
        icon: github
      weight: 50

outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
  llmsfull:
    mediaType: text/plain
    baseName: llms-full
    isPlainText: true
    notAlternative: true
  llmschunks:
    mediaType: application/json
    baseName: llms-chunks
    isPlainText: true
    notAlternative: true

outputs:
  home: [html, rss, llms, llmsfull, llmschunks]
  page: [html, markdown]
  section: [html, rss, markdown]
